name: mrproj
channels:
  - conda-forge
dependencies:
  - python=3.10
  - numpy<2
  - scipy
  - eigen=3.4.0              # TEASER++ needs Eigen 3.x
  - cmake
  - pip
  - pip:
      - open3d==0.18.0
      - plyfile
      - networkx
      - python-igraph
      - pandas
      - pyyaml
      - tqdm
      - huggingface_hub
      - pytest
